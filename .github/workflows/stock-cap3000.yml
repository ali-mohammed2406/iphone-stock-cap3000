name: iPhone

on:
  schedule:
    - cron: "*/5 * * * *"   # filet de sécurité si la chaîne s'interrompt
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Envoyer un email de test"
        type: boolean
        default: false
      duration:
        description: "Durée de la boucle (minutes)"
        default: "55"

permissions:
  contents: read
  actions: write   # pour relancer la boucle suivante

concurrency:
  group: stock-cap3000
  cancel-in-progress: false

jobs:
  check:
    name: "vérif"
    runs-on: ubuntu-latest
    timeout-minutes: 65
    outputs:
      alert: ${{ steps.stock.outputs.alert }}
      stores: ${{ steps.stock.outputs.stores }}
      quote: ${{ steps.stock.outputs.quote }}
      checked_at: ${{ steps.stock.outputs.checked_at }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: notif-state-${{ github.run_id }}
          restore-keys: notif-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: stock
        name: Interroger l'Apple Store
        run: python stock_iphone_cap3000.py --loop ${{ inputs.duration || 55 }} --interval 60

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: notif-state-${{ github.run_id }}

      # Enchaîne la boucle suivante sans dépendre du cron GitHub (souvent en retard).
      # Démarre dès que ce run (alerte comprise) est terminé, grâce au groupe de concurrence.
      - name: Relancer la surveillance
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run stock-cap3000.yml --ref main -R ${{ github.repository }}

  alerte:
    needs: check
    if: needs.check.outputs.alert == 'true' || inputs.test_alert
    name: ${{ inputs.test_alert && '🧪 TEST - 🚨 VITE, le 256 est disponible !' || format('🚨 VITE, le 256 est disponible à {0} !', needs.check.outputs.stores) }}
    runs-on: ubuntu-latest
    steps:
      - name: Alerte
        run: |
          {
            echo "## 📱 iPhone 18 Pro Max 256 Go Bordeaux disponible à ${{ needs.check.outputs.stores }}"
            echo ""
            echo "**Statut Apple :** ${{ needs.check.outputs.quote }} (vérifié le ${{ needs.check.outputs.checked_at }})"
            echo ""
            echo "👉 [Réserver en retrait](https://www.apple.com/fr/shop/buy-iphone/iphone-18-pro/%C3%A9cran-de-6,9-pouces-256go-bordeaux)"
            echo ""
            echo "Les créneaux partent en quelques minutes : réserve tout de suite."
            echo ""
            echo "_Ce run est marqué « failed » exprès pour que GitHub t'envoie un email._"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=🚨 VITE::Le 256 est disponible à ${{ needs.check.outputs.stores }} ! Réserve dans l'app Apple Store."
          exit 1
